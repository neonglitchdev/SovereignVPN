name: Suite
on: [pull_request, push]
jobs:
  suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Taratura estrattore — la mutazione deve dire rosso
        run: python3 tests/prova_corpus.py
      - name: Corpus dal documento
        run: |
          python3 estrai_corpus.py sorgente/SovereignVPN_PRD_RFC_14.0.docx corpus/
          cat corpus/profilo.json
      - name: Secret scan dei file (gitleaks 8.30.1, ANC-0315, T-025)
        run: |
          V=8.30.1; U=https://github.com/gitleaks/gitleaks/releases/download/v$V
          curl -sSfLO $U/gitleaks_${V}_linux_x64.tar.gz -O $U/gitleaks_${V}_checksums.txt
          grep " gitleaks_${V}_linux_x64.tar.gz$" gitleaks_${V}_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_${V}_linux_x64.tar.gz gitleaks
          ./gitleaks detect --no-git --source . --no-banner --redact
      - name: Registro delle ambiguità (citazioni verificate, mutante preso)
        run: |
          python3 tests/verifica_lettore.py . docs/lettore-nuovo-1.md
          python3 tests/verifica_incrociata.py .
      - name: Prove del control plane
        run: cd control-plane && python3 -m unittest discover -s tests -v
      - name: WireGuard vero sul runner (interfaccia di prova, revoca entro 5 s)
        run: |
          sudo apt-get install -y -qq wireguard-tools >/dev/null
          sudo bash control-plane/tests/prova_wg_vero.sh
      - name: nftables vero in un network namespace (policy, transazione, idempotenza)
        run: |
          sudo apt-get install -y -qq nftables >/dev/null
          sudo bash control-plane/tests/prova_nft_vero.sh
      - name: sysctl veri in un network namespace (inoltro IPv4 acceso, IPv6 spento)
        run: sudo bash control-plane/tests/prova_sysctl_vero.sh
      - name: Installer vero sul runner, unita' di avvio abilitata e verificata (con controllo negativo)
        run: |
          sudo bash ops/install.sh
          systemctl is-enabled sovereignvpn-reconcile.service sovereignvpn-expire.timer
          sudo systemd-analyze verify /etc/systemd/system/sovereignvpn-reconcile.service \
            /etc/systemd/system/sovereignvpn-expire.service /etc/systemd/system/sovereignvpn-expire.timer
          sed '/^ExecStart=/d' ops/systemd/sovereignvpn-reconcile.service > "$RUNNER_TEMP/sovereignvpn-guasta.service"
          if sudo systemd-analyze verify "$RUNNER_TEMP/sovereignvpn-guasta.service"; then
            echo "ROSSO: un'unita' senza ExecStart passa la verifica"; exit 1
          fi
          echo "OK: unita' installata, abilitata, verificata; quella senza ExecStart e' rifiutata"
          sudo bash ops/install.sh >/dev/null
          sudo touch /opt/sovereignvpn/sovereignctl/marca-ultima
          sudo bash ops/install.sh --rollback
          [ ! -e /opt/sovereignvpn/sovereignctl/marca-ultima ] && [ -e /opt/sovereignvpn/sovereignctl.precedente/marca-ultima ] || { echo "ROSSO: il rollback non ha rimesso la release precedente"; exit 1; }
          sudo bash ops/install.sh --rollback >/dev/null
          [ -e /opt/sovereignvpn/sovereignctl/marca-ultima ] || { echo "ROSSO: il secondo rollback non ha rimesso la piu' nuova"; exit 1; }
          sudo rm /opt/sovereignvpn/sovereignctl/marca-ultima
          /usr/local/bin/sovereignctl status --help >/dev/null
          echo "OK: rollback alla release precedente e ritorno, sul sistema vero (FR-OPS-005)"
          echo prova-dato | sudo tee /etc/sovereignvpn/prova-dato >/dev/null
          sudo bash ops/install.sh --uninstall
          for f in /usr/local/bin/sovereignctl /opt/sovereignvpn /etc/systemd/system/sovereignvpn-reconcile.service; do
            if [ -e "$f" ]; then echo "ROSSO: l'uninstall ha lasciato $f"; exit 1; fi
          done
          if systemctl is-enabled sovereignvpn-reconcile.service >/dev/null 2>&1; then echo "ROSSO: unita' ancora abilitata"; exit 1; fi
          [ "$(sudo cat /etc/sovereignvpn/prova-dato)" = prova-dato ] || { echo "ROSSO: l'uninstall senza scelta ha toccato i dati"; exit 1; }
          if sudo bash ops/install.sh --uninstall --elimina-dati; then echo "ROSSO: dati eliminati senza --conferma"; exit 1; fi
          sudo test -e /etc/sovereignvpn/prova-dato || { echo "ROSSO: un rifiuto ha cancellato i dati"; exit 1; }
          sudo bash ops/install.sh --uninstall --elimina-dati --conferma
          if sudo test -e /etc/sovereignvpn || sudo test -e /var/lib/sovereignvpn; then echo "ROSSO: --elimina-dati --conferma ha lasciato i dati"; exit 1; fi
          sudo bash ops/install.sh >/dev/null
          systemctl is-enabled sovereignvpn-reconcile.service sovereignvpn-expire.timer >/dev/null
          echo "OK: uninstall sul sistema vero: prodotto tolto, dati conservati; senza --conferma niente cancellato, con --conferma cancellati; reinstallato (FR-OPS-007)"
      - name: init --apply vero in un network namespace (sei passi, idempotente, chiave guasta, WAN rifiutata, riavvio)
        run: sudo bash control-plane/tests/prova_init_vero.sh
      - name: Backup vero con age (decifrato con la chiave giusta, non con un'altra, non se manomesso)
        run: |
          sudo apt-get install -y -qq age >/dev/null
          sudo bash control-plane/tests/prova_backup_vero.sh
      - name: Traffico vero fra due peer WireGuard e una internet finta (isolamento, DNS, SSH, amministrazione, revoca)
        run: sudo bash control-plane/tests/prova_traffico_vero.sh
      - name: DNS vero, Unbound e Pi-hole (DNSSEC, solo nel tunnel, deny, nessun nome nei log)
        run: sudo bash control-plane/tests/prova_dns_vero.sh
      - name: Unita' del DNS (systemd-analyze verify; Unbound avviato da systemd risponde col flag AD)
        run: |
          sudo /usr/local/bin/sovereignctl dns apply --interfaccia wg0
          sudo systemd-analyze verify /etc/systemd/system/sovereignvpn-unbound.service /etc/systemd/system/sovereignvpn-pihole.service
          sudo systemctl start sovereignvpn-unbound.service
          for i in $(seq 60); do dig +timeout=2 +tries=1 @127.0.0.1 -p 5335 . NS >/dev/null 2>&1 && break; sleep 1; done
          R="$(dig +dnssec +timeout=5 @127.0.0.1 -p 5335 isc.org A)"
          grep -q "status: NOERROR" <<<"$R" && grep -qE "flags:[^;]* ad[ ;]" <<<"$R" || { echo "$R"; echo "ROSSO: Unbound dell'unita' non risolve con DNSSEC"; exit 1; }
          systemctl is-active sovereignvpn-unbound.service
          esito_unbound() { sudo /usr/local/bin/sovereignctl status --config /etc/sovereignvpn/server.toml --json | python3 -c 'import json,sys; print({c["nome"]: c["esito"] for c in json.load(sys.stdin)["controlli"]}.get("unbound"))'; }
          [ "$(esito_unbound)" = "OK" ] || { echo "ROSSO: status non vede Unbound acceso"; exit 1; }
          sudo systemctl stop sovereignvpn-unbound.service
          [ "$(esito_unbound)" = "GUASTO" ] || { echo "ROSSO: status non vede Unbound spento"; exit 1; }
          echo "OK: status vede Unbound acceso (OK) e spento (GUASTO)"
          echo "OK: unita' verificate; Unbound avviato da systemd risolve isc.org col flag AD"
      - name: Banco dei mutanti (guasti presi, innocui vivi)
        run: cd control-plane && python3 tests/mutanti.py
      - name: Preflight vero sul runner, in dry-run
        run: |
          cd control-plane
          set +e; python3 -m sovereignctl init --check; c=$?; set -e
          echo "codice di uscita: $c (0 host conforme, 1 prerequisito mancante)"
          [ "$c" -le 1 ]
          set +e; python3 -m sovereignctl init --check --config ../config/examples/server.toml; c=$?; set -e
          echo "con l'esempio di configurazione, codice di uscita: $c"
          [ "$c" -le 1 ]
